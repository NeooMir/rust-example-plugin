[package]
name = "rust-example-plugin"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Native Rust UI Plugin for Pole / NeoMir IDE"

[dependencies]
pole-plugin-api = { path = "../../crates/pole-plugin-api" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
glib = "0.20"
gio = { package = "gio", version = "0.20" }
serde_json = "1.0"
